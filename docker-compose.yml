# Local stack: `docker compose up --build`, then open http://localhost:5173
#   API :8000   MinIO console :9001 (minioadmin/minioadmin)   MailHog :8025   Flower :5555   mock vendor :4000

x-pipeline-env: &pipeline-env
  DATABASE_URL: postgresql+psycopg2://pipeline:pipeline@postgres:5432/pipeline
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT_URL: http://minio:9000
  S3_PUBLIC_ENDPOINT_URL: http://localhost:9000  # presigned URLs are called by the browser
  S3_EVENTS_TOKEN: dev-s3-events-token
  VENDOR_URL: http://mock-vendor:4000
  VENDOR_SLOTS: ${VENDOR_SLOTS:-20}
  VENDOR_TIMEOUT_S: ${VENDOR_TIMEOUT_S:-30}
  VENDOR_PER_USER_SLOTS: ${VENDOR_PER_USER_SLOTS:-10}
  SMTP_HOST: mailhog
  SMTP_PORT: "1025"
  WEBHOOK_SECRET: dev-webhook-secret
  CORS_ORIGINS: '["http://localhost:5173"]'

x-pipeline: &pipeline
  build: .
  image: file-pipeline:local
  environment: *pipeline-env
  restart: unless-stopped
  depends_on:
    migrate: { condition: service_completed_successfully }
    redis: { condition: service_healthy }
    minio-init: { condition: service_completed_successfully }

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: pipeline
      POSTGRES_DB: pipeline
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]  # durable queues (AOF)
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:5173
      MINIO_API_STALE_UPLOADS_EXPIRY: 24h  # backstop for abandoned multipart uploads
      MINIO_NOTIFY_WEBHOOK_ENABLE_PRIMARY: "on"
      MINIO_NOTIFY_WEBHOOK_ENDPOINT_PRIMARY: http://api:8000/internal/s3-events
      MINIO_NOTIFY_WEBHOOK_AUTH_TOKEN_PRIMARY: dev-s3-events-token
      MINIO_NOTIFY_WEBHOOK_QUEUE_DIR_PRIMARY: /data/.events
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      retries: 30

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 minioadmin minioadmin
        mc mb --ignore-existing local/uploads
        mc anonymous set none local/uploads
        mc event add local/uploads arn:minio:sqs::PRIMARY:webhook --event put --prefix uploads/ || true
        echo "bucket ready"

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports: ["1025:1025", "8025:8025"]

  mock-vendor:
    build: .
    image: file-pipeline:local
    command: ["uvicorn", "mock_vendor.app:app", "--host", "0.0.0.0", "--port", "4000", "--workers", "1"]
    environment:
      MOCK_LATENCY_SCALE: ${MOCK_LATENCY_SCALE:-1.0}
      MOCK_ERROR_RATE: ${MOCK_ERROR_RATE:-0.05}
      MOCK_TIMEOUT_RATE: ${MOCK_TIMEOUT_RATE:-0.02}
      MOCK_REJECT_RATE: ${MOCK_REJECT_RATE:-0.01}
      WEBHOOK_SECRET: dev-webhook-secret
    ports: ["4000:4000"]

  migrate:
    build: .
    image: file-pipeline:local
    environment: *pipeline-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *pipeline
    command: ["uvicorn", "pipeline.api.app:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      retries: 20

  worker-extract:
    <<: *pipeline
    command: ["celery", "-A", "pipeline.celery_app", "worker", "-Q", "extract", "-P", "prefork", "-c", "4",
              "--autoscale=8,2", "-n", "extract@%h", "--loglevel=INFO"]
    deploy: { replicas: 2 }
    stop_grace_period: 60s

  worker-deliver:
    <<: *pipeline
    environment:
      <<: *pipeline-env
      PIPELINE_GEVENT: "1"
    command: ["celery", "-A", "pipeline.celery_app", "worker", "-Q", "deliver", "-P", "gevent", "-c", "50",
              "-n", "deliver@%h", "--loglevel=INFO"]
    stop_grace_period: 60s  # longer than the 30 s vendor timeout: warm shutdown finishes in-flight calls

  worker-notify:
    <<: *pipeline
    command: ["celery", "-A", "pipeline.celery_app", "worker", "-Q", "notify,housekeeping", "-P", "prefork",
              "-c", "2", "-n", "notify@%h", "--loglevel=INFO"]

  beat:
    <<: *pipeline
    command: ["celery", "-A", "pipeline.celery_app", "beat", "--schedule", "/tmp/celerybeat-schedule",
              "--loglevel=INFO"]

  dispatcher:
    <<: *pipeline
    command: ["python", "-m", "pipeline.dispatcher"]
    deploy: { replicas: 2 }  # leader + standby (leader lock in Redis)
    stop_grace_period: 15s

  flower:
    <<: *pipeline
    command: ["celery", "-A", "pipeline.celery_app", "flower", "--port=5555"]
    ports: ["5555:5555"]

  web:
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-c", "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"]
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./web:/app
      - webnode:/app/node_modules
    ports: ["5173:5173"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  miniodata:
  webnode:
