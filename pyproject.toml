[project]
name = "file-pipeline"
version = "0.1.0"
description = "Concurrent file processing pipeline: direct-to-S3 upload, Celery extraction, rate-limited vendor delivery"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg2-binary>=2.9",
  "celery[redis]>=5.4",
  "redis>=5.0",
  "boto3>=1.35",
  "httpx>=0.27",
  "pypdf>=5.0",
  "openpyxl>=3.1",
  "structlog>=24.1",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
workers = ["gevent>=24.2", "psycogreen>=1.0", "flower>=2.0"]
dev = [
  "pytest>=8",
  "fakeredis[lua]>=2.23",
  "moto[s3]>=5.0",
  "freezegun>=1.5",
  "reportlab>=4.0",
  "locust>=2.29",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeline*", "mock_vendor*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
